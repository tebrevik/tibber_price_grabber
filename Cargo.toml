[package]
name = "tibber_price_grabber"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
graphql_client = { version = "^0.16.0", features = ["reqwest-blocking"] }
serde = "^1.0.229"
reqwest = { version = "^0.12", features = ["json", "blocking"]}
chrono = "^0.4.45"
chrono-tz = "^0.10.4"
cloudevents-sdk = { git = "https://github.com/tebrevik/sdk-rust", features = ["nats"] }
uuid = { version = "^1.24.0", features = ["v4"] }
serde_json = "^1.0.151"
serde_bytes = "0.11.19"
clap = { version = "^4.6.6", features = ["derive"] }
async-nats = "^0.50.0"
tokio = { version = "1.53.1", features = ["full"] }

